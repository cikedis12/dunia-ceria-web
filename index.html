<style>
:root{--ink:#17324d;--blue:#38bdf8;--green:#22c55e;--yellow:#facc15;--pink:#f9a8d4;--card:#ffffffed}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#9be7ff}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.topbar{position:fixed;top:env(safe-area-inset-top,10px);left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:3;pointer-events:none}.brand,.pill,.iconbtn{background:var(--card);border:2px solid #fff;border-radius:18px;box-shadow:0 4px 14px #22557722;padding:9px 13px;font-weight:800}.brand{font-size:15px}.pill{margin-left:auto}.iconbtn{pointer-events:auto;border:0;font-size:17px;min-width:44px;min-height:42px}.hint{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:2;background:#ffffffd9;border-radius:16px;padding:8px 14px;font-size:12px;font-weight:700;text-align:center;max-width:90%;box-shadow:0 3px 12px #17415b22}.bottom{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:space-between;align-items:end;z-index:3;pointer-events:none}.joy{width:116px;height:116px;border-radius:50%;background:#ffffff8c;border:3px solid #fff;position:relative;pointer-events:auto;touch-action:none;box-shadow:0 4px 16px #24516a22}.knob{position:absolute;width:48px;height:48px;left:31px;top:31px;border-radius:50%;background:#38bdf8;border:3px solid white;box-shadow:0 3px 8px #1e609055}.actions{display:flex;gap:9px;pointer-events:auto;align-items:end}.action{border:3px solid white;border-radius:20px;padding:13px 14px;background:#fef08a;font-weight:900;color:#664b00;box-shadow:0 4px 12px #2345;font-size:13px}.action.green{background:#bbf7d0;color:#14532d}.panelback{position:fixed;inset:0;background:#12324c77;z-index:10;display:none;align-items:center;justify-content:center;padding:14px}.panelback.show{display:flex}.panel{width:min(520px,100%);max-height:88dvh;overflow:auto;background:#fff;border-radius:26px;padding:20px;box-shadow:0 20px 60px #1238}.panel h2{margin:0 0 8px;font-size:23px}.sub{color:#527087;font-size:13px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.answer,.bigbtn{border:0;border-radius:17px;padding:15px;background:#e0f2fe;font-size:17px;font-weight:850;color:#16415d}.answer:active,.bigbtn:active{transform:scale(.98)}.bigbtn{background:#22c55e;color:white;width:100%;margin-top:12px}.close{float:right;border:0;background:#eef5f8;border-radius:50%;width:36px;height:36px;font-size:19px}.zonegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.zone{padding:12px;border-radius:17px;background:#f0f9ff;font-weight:800}.zone small{display:block;font-weight:500;color:#5b7181}.progressrow{margin:13px 0}.track{height:10px;background:#e8eff4;border-radius:99px;overflow:hidden}.fill{height:100%;background:#22c55e;border-radius:99px}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:13px;background:#f0f9ff;border-radius:17px}.stat b{font-size:25px;display:block}.wardrobe{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.skin{width:62px;height:62px;border-radius:18px;border:4px solid white;box-shadow:0 0 0 2px #dbe6ed;display:grid;place-items:center;font-size:26px}.skin.locked{filter:grayscale(1);opacity:.45}.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:20;background:#143b55;color:#fff;border-radius:99px;padding:11px 17px;font-weight:800;display:none}.toast.show{display:block}@media(min-width:800px){.joy{width:130px;height:130px}.knob{left:37px;top:37px}.bottom{max-width:900px;margin:auto;left:0;right:0}}
</style>
